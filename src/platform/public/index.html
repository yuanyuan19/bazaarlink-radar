<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>检测记录</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/tokens.css" />
    <style>
      html, body { background: var(--bg); color: var(--fg); font-family: var(--font); }
      * { box-sizing: border-box; }
      body { margin: 0; line-height: 1.5; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: var(--fg-muted); }
      .shell { min-height: 100vh; display: grid; grid-template-columns: 196px 1fr; }
      .sidebar { background: var(--bg); border-right: 1px solid var(--border); padding: 18px 12px; }
      .brand { padding: 4px 10px 18px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .brand small { display: block; margin-top: 4px; color: var(--fg-subtle); font-size: 12px; font-weight: 500; }
      nav { display: grid; gap: 2px; }
      nav button { border: 0; background: transparent; color: var(--fg-muted); text-align: left; padding: 8px 10px; border-radius: 8px; }
      nav button:hover { background: var(--btn-hover); color: var(--fg); }
      nav button.active { background: var(--sl3); color: var(--fg); font-weight: 650; }
      .main { min-width: 0; padding: 18px 24px 64px; }
      .canvas { max-width: 1040px; margin: 0 auto; width: 100%; }
      .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 8px; }
      .page-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
      .page-title small { display: block; margin-top: 2px; color: var(--fg-muted); font-size: 13px; font-weight: 500; }
      .health { font-size: 12px; color: var(--pass); flex: none; }
      .health.error { color: var(--accent); }
      .explain {
        margin: 0 0 12px; padding: 8px 12px;
        border: 1px solid color-mix(in srgb, var(--pass) 40%, var(--border));
        background: color-mix(in srgb, var(--pass) 8%, var(--sl2));
        border-radius: 8px; font-size: 12.5px; line-height: 1.55; color: var(--fg-muted);
      }
      .explain p { margin: 0; }
      .filter-panel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 6px; }
      .filter-panel input#query { flex: 1 1 200px; min-width: 160px; max-width: 260px; }
      .filter-panel select { flex: 0 0 128px; max-width: 160px; }
      .filter-panel select, .filter-panel input, textarea#siteNote {
        min-height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; background: var(--bg);
      }
      .filter-panel select:focus, .filter-panel input:focus, textarea#siteNote:focus { outline: 0; border-color: var(--border-hi); }
      .filter-clear, .fav-toggle {
        min-height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; background: var(--btn-bg); white-space: nowrap; flex: none;
      }
      .fav-toggle.on { background: var(--sl12); color: #fff; border-color: var(--sl12); }
      .filter-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--fg-subtle); font-size: 12px; margin: 0 0 8px; }
      .crumb { font-size: 13px; color: var(--fg-muted); margin: 0 0 10px; }
      .crumb button { border: 0; background: transparent; color: var(--neutral); padding: 0; }
      .submit { display: grid; gap: 8px; margin: 0 0 10px; }
      .submit-creds { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; }
      .submit-model { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .submit input { min-height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; background: var(--bg); }
      .submit input:focus { outline: 0; border-color: var(--border-hi); }
      .go { min-height: 34px; border: 0; border-radius: 8px; padding: 0 16px; background: var(--sl12); color: #fff; white-space: nowrap; }
      .go:hover { background: #14171a; }
      .go:disabled { opacity: .5; }
      .mode-list { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
      .mode-card {
        display: flex; align-items: flex-start; gap: 8px; text-align: left; border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 10px; background: var(--bg); color: var(--fg-muted); font-size: 12px; line-height: 1.4;
      }
      .mode-card i { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; border: 1.5px solid var(--sl8); flex: none; }
      .mode-card strong { display: block; color: var(--fg); font-size: 13px; margin-bottom: 2px; }
      .mode-card.on { border-color: color-mix(in srgb, var(--pass) 45%, var(--border)); background: color-mix(in srgb, var(--pass) 8%, var(--sl2)); color: var(--fg); }
      .mode-card.on i { background: var(--pass); border-color: var(--pass); }
      table { width: 100%; border-collapse: collapse; }
      table.runs, table.sites { table-layout: fixed; }
      th, td { text-align: left; padding: 8px 8px; vertical-align: middle; }
      th { color: var(--fg-subtle); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
      th.sortable { cursor: pointer; }
      th.sortable.active { color: var(--fg); }
      td { border-bottom: 1px solid var(--sl3); font-size: 13px; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .runs .col-host { width: 22%; }
      .runs .col-model { width: 20%; }
      .runs .col-ident { width: 22%; }
      .runs .col-prog { width: 16%; }
      .runs .col-score { width: 8%; }
      .runs .col-time { width: 12%; }
      .sites .col-host { width: 26%; }
      .sites .col-n { width: 10%; }
      .sites .col-week { width: 12%; }
      .sites .col-rate { width: 13%; }
      .sites .col-sub { width: 8%; }
      .sites .col-models { width: 8%; }
      .sites .col-time { width: 13%; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: var(--sl2); }
      tbody tr.live { background: color-mix(in srgb, var(--pass) 6%, var(--bg)); }
      .host-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .host-cell > div { min-width: 0; flex: 1; }
      .host { color: var(--fg); font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .star, .jump { border: 0; background: transparent; color: var(--fg-subtle); padding: 0; min-width: 18px; line-height: 1.2; flex: none; }
      .star { font-size: 15px; }
      .star.on { color: var(--warn); }
      .jump { font-size: 13px; color: var(--neutral); }
      .jump:hover { color: var(--fg); }
      .site-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; }
      .site-head .host { font-size: 18px; overflow: visible; white-space: normal; }
      .site-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
      .site-actions a, .site-actions button.secondary {
        min-height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--btn-bg); color: var(--fg); text-decoration: none; display: inline-flex; align-items: center;
      }
      .overview { display: flex; flex-wrap: wrap; gap: 18px; margin: 0 0 16px; }
      .overview label { display: block; color: var(--fg-subtle); font-size: 12px; }
      .model { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; min-width: 0; }
      .model-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .logo { width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 800; flex: none; font-family: var(--font); }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; }
      .pill.ok { color: var(--pass); background: color-mix(in srgb, var(--pass) 12%, var(--sl2)); }
      .ident.sub { color: var(--accent); }
      .ident.unknown, .ident.pending { color: var(--neutral); }
      .ident.fail { color: var(--fg-muted); }
      .timer { display: inline-flex; align-items: center; gap: 7px; background: var(--sl12); color: #fff; border-radius: 999px; padding: 3px 8px; font-size: 12px; }
      .timer i { width: 36px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, var(--pass), var(--sl12) 55%); }
      .skip { color: var(--fg-subtle); }
      .warn { color: var(--warn); }
      .bar { display: block; margin-top: 5px; height: 3px; width: 84px; background: var(--sl3); overflow: hidden; }
      .bar b { display: block; height: 100%; background: var(--sl11); }
      .score { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .time { color: var(--fg-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .time small { display: block; color: var(--fg-subtle); font-size: 11px; margin-top: 2px; }
      .empty { padding: 48px 12px; text-align: center; color: var(--fg-muted); }
      .pager { display: flex; justify-content: flex-end; gap: 8px; padding-top: 14px; }
      .pager button { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; min-height: 30px; padding: 0 10px; color: var(--fg-muted); }
      .pager button:hover { background: var(--btn-bg); }
      .status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
      .status-grid div { padding: 12px 0; }
      .status-grid label { display: block; color: var(--fg-subtle); font-size: 12px; margin-bottom: 4px; }
      textarea#siteNote { width: 100%; min-height: 110px; padding: 10px; }
      .save-row { margin: 10px 0 18px; }
      @media (max-width: 860px) {
        .shell { display: block; }
        .sidebar { border-right: 0; border-bottom: 1px solid var(--border); padding: 12px; }
        .brand { display: inline-block; padding: 4px 8px; }
        nav { display: flex; overflow-x: auto; }
        nav button { white-space: nowrap; }
        .main { padding: 14px 12px 64px; }
        .canvas { max-width: none; }
        .submit-creds, .submit-model, .mode-list, .status-grid { grid-template-columns: 1fr; }
        .filter-panel input#query, .filter-panel select { max-width: none; flex: 1 1 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">BazaarLink Insight<small>自己的检测台</small></div>
        <nav id="nav">
          <button class="active" data-view="public">公开检测</button>
          <button data-view="mine">我的检测</button>
          <button data-view="sites">站点</button>
          <button data-view="status">采集</button>
        </nav>
      </aside>
      <main class="main">
        <div class="canvas">
          <div class="top">
            <div class="page-title" id="pageTitle">公开检测<small>别人测完、我们入库的公开记录</small></div>
            <div class="health" id="health">正在检查数据连接</div>
          </div>
          <section id="content"></section>
        </div>
      </main>
    </div>
    <script>
      const titles = {
        public: ["公开检测", "别人测完、我们入库的公开记录"],
        mine: ["我的检测", "自己填 URL 和 Key 去测，结果只存本机"],
        sites: ["站点", "按域名把检测记录捏在一起，看这个站靠不靠谱"],
        status: ["采集", "公开历史有没有按时抓回来"],
      };
      const state = {
        view: "public", q: "", model: "", verdict: "", scoreMin: "", scoreMax: "", since: "", minWeekRate: "",
        favorite: false, host: "", siteHost: "", sort: "last_seen_at", offset: 0, limit: 50,
        live: {}, copy: null, endpointModels: [], filters: null, mode: "quick",
        draft: { baseUrl: "", apiKey: "", modelId: "" },
      };
      const $ = (id) => document.getElementById(id);
      const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c]));

      async function json(url, options) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "请求失败");
        return data;
      }

      function hist() { return state.copy?.history || {}; }

      function relativeTime(value) {
        if (!value) return "—";
        const delta = Date.now() - new Date(value).getTime();
        if (!Number.isFinite(delta)) return "—";
        if (delta < 0) return "即将";
        const min = Math.floor(delta / 60000);
        if (min < 1) return "刚刚";
        if (min < 60) return min + " 分钟前";
        const hour = Math.floor(min / 60);
        if (hour < 24) return hour + " 小时前";
        return Math.floor(hour / 24) + " 天前";
      }

      function clock(value) {
        if (!value) return "";
        const date = new Date(value);
        if (!Number.isFinite(date.getTime())) return "";
        return date.toLocaleString("zh-CN", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      function elapsed(value) {
        const sec = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
        return Number.isFinite(sec) ? sec + "s" : "…";
      }

      function brand(model) {
        const id = String(model || "").toLowerCase();
        if (id.includes("claude") || id.includes("anthropic")) return { letter: "A", bg: "#d97757" };
        if (id.includes("gpt") || id.includes("openai") || /\bo[1-9]\b/.test(id)) return { letter: "O", bg: "#10a37f" };
        if (id.includes("deepseek")) return { letter: "D", bg: "#4d6bfe" };
        if (id.includes("qwen") || id.includes("dashscope")) return { letter: "Q", bg: "#615ced" };
        if (id.includes("gemini") || id.includes("google")) return { letter: "G", bg: "#4285f4" };
        if (id.includes("glm")) return { letter: "Z", bg: "#3859ff" };
        return { letter: "M", bg: "#8a8a8a" };
      }

      function prettyModel(value) {
        return String(value || "—").replace(/^anthropic\//, "").replace(/^openai\//, "").replace(/^deepseek\//, "").replace(/^qwen\//, "").replace(/-/g, " ");
      }

      function ident(row) {
        const live = state.live[row.id];
        if (row.pending || live?.status === "running" || live?.status === "queued") {
          return '<span class="timer"><i></i>' + esc(elapsed(row.createdAt)) + "</span>";
        }
        if (row.verdict === "match") return '<span class="pill ok">' + esc(prettyModel(row.actualModel || row.modelId)) + "</span>";
        if (row.verdict === "family_match") return '<span class="pill ok">家族相符 · ' + esc(prettyModel(row.actualModel || row.actualFamily)) + "</span>";
        if (row.verdict === "substitution") return '<span class="ident sub">模型不符 · ~' + esc(prettyModel(row.actualModel || "未知模型")) + "</span>";
        if (row.verdict === "error") return '<span class="ident fail">● ' + esc(hist().histStatusFailed || "检测失败") + "</span>";
        return '<span class="ident unknown">' + esc(hist().histStatusInconclusive || "无法判定") + "</span>";
      }

      function quickish(row) { return row.displayScore == null || row.displayScore === 0; }

      function progressCell(row) {
        const live = state.live[row.id];
        const percent = live?.progress?.percent;
        if (percent != null) return percent + "% · " + live.progress.done + "/" + live.progress.total + '<span class="bar"><b style="width:' + percent + '%"></b></span>';
        if (row.pending) return '<span class="ident pending">' + esc(hist().histStatusRunning || "进行中") + "</span>";
        if (quickish(row) && !(row.errorCount > 0)) return '<span class="skip">' + esc(hist().histQuickModeNote || "快速模式跳过质量评分") + "</span>";
        if (row.errorCount > 0) return '<span class="warn" title="' + esc(hist().histCoverageTooltip) + '">⚠ 缺 ' + row.errorCount + " 题</span>";
        return "—";
      }

      function scoreCell(row) {
        const live = state.live[row.id];
        const score = live?.displayScore ?? row.displayScore;
        if (row.pending) return "—";
        if (score == null || score === 0) return '<span class="skip">' + esc(hist().histQuickModeScoreLabel || "快速测试") + "</span>";
        return '<span class="score">' + esc(score) + "</span>";
      }

      function timeCell(value) {
        return '<div class="time" title="' + esc(value ? new Date(value).toLocaleString("zh-CN", { hour12: false }) : "") + '">' + esc(relativeTime(value)) + "<small>" + esc(clock(value)) + "</small></div>";
      }

      function pct(value) { return value == null ? "—" : Number(value).toFixed(1) + "%"; }

      function starBtn(host, favorite) {
        return '<button type="button" class="star' + (favorite ? " on" : "") + '" data-host="' + esc(host) + '" title="收藏">' + (favorite ? "★" : "☆") + "</button>";
      }

      function hostCell(row, kind) {
        const host = row.host || "";
        const jump = kind === "run" ? '<button type="button" class="jump" data-host="' + esc(host) + '" title="打开站点分析">↗</button>' : "";
        return '<div class="host-cell">' + starBtn(host, row.isFavorite) + '<div class="host">' + esc(host || row.baseUrl || "—") + "</div>" + jump + "</div>";
      }

      function selected(current, value) { return current === value ? " selected" : ""; }

      function optionTag(value, label, current) {
        return '<option value="' + esc(value) + '"' + selected(current, value) + ">" + label + "</option>";
      }

      function selectBox(id, current, options) {
        return '<select id="' + id + '">' + options.map((item) => optionTag(item[0], item[1], current)).join("") + "</select>";
      }

      function scoreSelectValue() {
        if (state.scoreMax === "50") return "below50";
        if (state.scoreMin === "80") return "80";
        if (state.scoreMin === "50") return "50";
        if (state.scoreMin === "1") return "has";
        return "";
      }

      function pageExplain() {
        if (state.view === "public") {
          return '<div class="explain"><p>官方公开历史，定时抓回，只读。点一行看报告，↗ 看站点，★ 收藏。相符 = 就是声称的模型；替换 = 声称 A 实际更像 B；无法判定 = 题目不够或模式太快。</p></div>';
        }
        if (state.view === "mine") {
          return '<div class="explain"><p>Key 只转发给官方检测，不写库。填好 URL 和 Key 后点模型框拉取该站清单。提交后本行先显示进度，跑完变成结果。</p></div>';
        }
        if (state.view === "sites") {
          return '<div class="explain"><p>每一行是一个中转站，由公开检测和我的检测按域名聚合。近 7 天相符率是站级指标，不是单次分数。点一行进详情，可收藏、写备注。</p></div>';
        }
        return '<div class="explain"><p>官方公开历史大约每 30 分钟抓一次，抓回来的进入公开检测。这页只看采集健不健康。</p></div>';
      }

      function metaRow(countText) {
        return '<div class="filter-meta"><span>条件同时生效，每个字段可单独「不限」</span><span>' + esc(countText) + "</span></div>";
      }

      function weekRateOptions() {
        return [["", "近 7 天相符率：不限"], ["80", "≥ 80%"], ["50", "≥ 50%"], ["0", "有数据"]];
      }

      function sinceOptions(blank) {
        return [["", blank], ["24h", "最近 24 小时"], ["7d", "最近 7 天"], ["30d", "最近 30 天"]];
      }

      function favClear() {
        return '<button class="fav-toggle' + (state.favorite ? " on" : "") + '" id="favOnly" type="button">' + (state.favorite ? "★ 只看收藏" : "☆ 只看收藏") + "</button>" +
          '<button class="filter-clear" id="clearFilters" type="button">清空</button>';
      }

      function toolbar(placeholder) {
        const models = state.filters?.models || [];
        const verdicts = [["", "判定：不限"], ["match", "相符"], ["substitution", "替换"], ["unknown", "无法判定"], ["error", "检测失败"]];
        if (state.view === "mine") verdicts.push(["pending", "进行中"]);
        return '<div class="filter-panel"><input id="query" placeholder="' + esc(placeholder) + '" value="' + esc(state.q) + '">' +
          selectBox("filterModel", state.model, [["", "模型：不限"]].concat(models.map((item) => [item.id, esc(item.id) + "（" + item.count + "）"]))) +
          selectBox("filterVerdict", state.verdict, verdicts) +
          selectBox("filterScore", scoreSelectValue(), [["", "分数：不限"], ["80", "≥ 80"], ["50", "≥ 50"], ["below50", "&lt; 50"], ["has", "有分数"]]) +
          selectBox("filterSince", state.since, sinceOptions("时间：不限")) +
          selectBox("filterWeek", state.minWeekRate, weekRateOptions()) +
          favClear() + "</div>";
      }

      function siteToolbar() {
        return '<div class="filter-panel"><input id="query" placeholder="筛选站点或备注" value="' + esc(state.q) + '">' +
          selectBox("filterWeek", state.minWeekRate, weekRateOptions()) +
          selectBox("filterSince", state.since, sinceOptions("最近出现：不限")) +
          favClear() + "</div>";
      }

      function modeCards() {
        const modes = [
          ["quick", "快速", "只验身份，几十秒。分数显示「快速测试」。"],
          ["full", "完整", "96～98 项，给 0–100 分，大约 1–3 分钟。"],
          ["deep", "深度", "完整 + 长上下文检查，大约 3–5 分钟。"],
        ];
        return '<div class="mode-list">' + modes.map(([id, label, hint]) => '<button type="button" class="mode-card' + (state.mode === id ? " on" : "") + '" data-mode="' + id + '"><i></i><span><strong>' + label + "</strong>" + hint + "</span></button>").join("") + "</div>";
      }

      function submitForm() {
        return '<form class="submit" id="submitForm">' +
          '<div class="submit-creds">' +
          '<input id="baseUrl" placeholder="中转站 URL" required value="' + esc(state.draft.baseUrl) + '">' +
          '<input id="apiKey" type="password" placeholder="API Key，只转发不保存" required value="' + esc(state.draft.apiKey) + '">' +
          "</div>" +
          '<div class="submit-model">' +
          '<input id="modelId" list="modelList" placeholder="先填 URL 和 Key，再点这里拉取" required value="' + esc(state.draft.modelId) + '">' +
          '<button class="go" id="submitBtn" type="submit">提交检测</button>' +
          "</div>" +
          '<datalist id="modelList">' + (state.endpointModels || []).map((id) => '<option value="' + esc(id) + '">').join("") + "</datalist>" +
          modeCards() +
          "</form>";
      }

      function hasActiveFilters() {
        return !!(state.q || state.model || state.verdict || state.scoreMin || state.scoreMax || state.since || state.minWeekRate || state.favorite || state.host);
      }

      function runTable(rows) {
        const h = hist();
        if (!rows.length) {
          if (!hasActiveFilters() && state.view === "mine") return '<div class="empty">还没有自己的检测。填 URL 和 Key 提交一条。</div>';
          if (!hasActiveFilters()) return '<div class="empty">' + esc(h.histEmpty || "没有符合筛选条件的记录") + "</div>";
          return '<div class="empty">' + esc(h.histEmpty || "没有符合筛选条件的记录") + '　<button class="filter-clear" id="emptyClear" type="button">清空筛选</button></div>';
        }
        return '<table class="runs"><thead><tr>' +
          '<th class="col-host">' + esc(h.histColRelay || "中转站") + "</th>" +
          '<th class="col-model">' + esc(h.histColModel || "模型") + "</th>" +
          '<th class="col-ident">' + esc(h.histColScore || "识别") + "</th>" +
          '<th class="col-prog">' + esc(h.histColStatus || "影响判定题数") + "</th>" +
          '<th class="col-score num">' + esc(h.histColScoreValue || "分数") + "</th>" +
          '<th class="col-time">' + esc(h.histColTime || "时间") + "</th></tr></thead><tbody>" +
          rows.map((row) => {
            const mark = brand(row.modelId);
            const report = row.sourceReportUrl || ("https://bazaarlink.ai/probe?runId=" + encodeURIComponent(row.id));
            return '<tr data-id="' + esc(row.id) + '" data-created="' + esc(row.createdAt || "") + '" data-report="' + esc(report) + '"' + (row.pending ? ' class="live"' : "") + ">" +
              '<td class="col-host">' + hostCell(row, "run") + "</td>" +
              '<td class="col-model"><div class="model"><span class="logo" style="background:' + mark.bg + '">' + mark.letter + '</span><span class="model-id">' + esc(row.modelId || "—") + "</span></div></td>" +
              '<td class="col-ident">' + ident(row) + "</td>" +
              '<td class="col-prog">' + progressCell(row) + "</td>" +
              '<td class="col-score num">' + scoreCell(row) + "</td>" +
              '<td class="col-time">' + timeCell(row.createdAt) + "</td></tr>";
          }).join("") + "</tbody></table>";
      }

      function pager(total) {
        if (total <= state.limit) return "";
        const page = Math.floor(state.offset / state.limit) + 1;
        const pages = Math.ceil(total / state.limit);
        return '<div class="pager"><button id="prevPage"' + (state.offset <= 0 ? " disabled" : "") + ">上一页</button><span class=\"time\">" + page + " / " + pages + "</span><button id=\"nextPage\"" + (state.offset + state.limit >= total ? " disabled" : "") + ">下一页</button></div>";
      }

      function debounce(fn, ms) {
        let timer;
        return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
      }

      function setTitle() {
        const pair = titles[state.view] || titles.public;
        $("pageTitle").innerHTML = esc(pair[0]) + "<small>" + esc(pair[1]) + "</small>";
      }

      function resetFilters() {
        state.q = "";
        state.model = "";
        state.verdict = "";
        state.scoreMin = "";
        state.scoreMax = "";
        state.since = "";
        state.minWeekRate = "";
        state.favorite = false;
        state.host = "";
        state.siteHost = "";
        state.offset = 0;
      }

      function bindCommon(reload) {
        const query = $("query");
        if (query) query.addEventListener("input", debounce(() => { state.q = query.value.trim(); state.offset = 0; reload(); }, 250));
        $("filterModel")?.addEventListener("change", (event) => { state.model = event.target.value; state.offset = 0; reload(); });
        $("filterVerdict")?.addEventListener("change", (event) => { state.verdict = event.target.value; state.offset = 0; reload(); });
        $("filterScore")?.addEventListener("change", (event) => {
          const value = event.target.value;
          state.scoreMin = value === "80" || value === "50" ? value : (value === "has" ? "1" : "");
          state.scoreMax = value === "below50" ? "50" : "";
          state.offset = 0;
          reload();
        });
        $("filterSince")?.addEventListener("change", (event) => { state.since = event.target.value; state.offset = 0; reload(); });
        $("filterWeek")?.addEventListener("change", (event) => { state.minWeekRate = event.target.value; state.offset = 0; reload(); });
        $("favOnly")?.addEventListener("click", () => { state.favorite = !state.favorite; state.offset = 0; reload(); });
        const clear = () => { resetFilters(); reload(); };
        $("clearFilters")?.addEventListener("click", clear);
        $("emptyClear")?.addEventListener("click", clear);
        $("prevPage")?.addEventListener("click", () => { state.offset = Math.max(0, state.offset - state.limit); reload(); });
        $("nextPage")?.addEventListener("click", () => { state.offset += state.limit; reload(); });
      }

      function bindHostActions() {
        document.querySelectorAll(".star").forEach((button) => button.addEventListener("click", async (event) => {
          event.stopPropagation();
          const host = button.dataset.host;
          if (!host) return;
          try {
            await json("/api/sites/" + encodeURIComponent(host), {
              method: "PATCH",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ isFavorite: !button.classList.contains("on") }),
            });
            if (state.view === "sites") loadSites();
            else loadRuns();
          } catch (error) {
            showError(error);
          }
        }));
        document.querySelectorAll(".jump").forEach((button) => button.addEventListener("click", (event) => {
          event.stopPropagation();
          if (button.dataset.host) goToSite(button.dataset.host);
        }));
      }

      function rememberDraft() {
        const baseUrl = $("baseUrl");
        const apiKey = $("apiKey");
        const modelId = $("modelId");
        if (baseUrl) state.draft.baseUrl = baseUrl.value;
        if (apiKey) state.draft.apiKey = apiKey.value;
        if (modelId) state.draft.modelId = modelId.value;
      }

      async function fetchEndpointModels() {
        rememberDraft();
        const baseUrl = state.draft.baseUrl.trim();
        const apiKey = state.draft.apiKey.trim();
        const input = $("modelId");
        if (!baseUrl || !apiKey) {
          if (input) input.placeholder = "先填 URL 和 Key，再点这里拉取";
          return;
        }
        if (input) input.placeholder = "拉取中…";
        try {
          const data = await json("/api/endpoint-models", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ baseUrl, apiKey }),
          });
          state.endpointModels = data.models || [];
          const list = $("modelList");
          if (list) list.innerHTML = state.endpointModels.map((id) => '<option value="' + esc(id) + '">').join("");
          if (input && !input.value && state.endpointModels[0]) {
            input.value = state.endpointModels[0];
            state.draft.modelId = state.endpointModels[0];
          }
          if (input) input.placeholder = state.endpointModels.length ? "从该站拉取的模型" : "该站没返回清单，可手填";
        } catch (error) {
          if (input) input.placeholder = "拉取失败，可手填模型 id";
          showError(error);
        }
      }

      async function bindSubmit() {
        $("baseUrl")?.addEventListener("input", () => { rememberDraft(); state.endpointModels = []; });
        $("apiKey")?.addEventListener("input", () => { rememberDraft(); state.endpointModels = []; });
        $("modelId")?.addEventListener("input", rememberDraft);
        $("modelId")?.addEventListener("focus", fetchEndpointModels);
        $("modelId")?.addEventListener("click", fetchEndpointModels);
        document.querySelectorAll(".mode-card").forEach((card) => card.addEventListener("click", () => {
          state.mode = card.dataset.mode;
          document.querySelectorAll(".mode-card").forEach((item) => item.classList.toggle("on", item === card));
        }));
        $("submitForm").addEventListener("submit", async (event) => {
          event.preventDefault();
          rememberDraft();
          const button = $("submitBtn");
          button.disabled = true;
          button.textContent = "提交中…";
          try {
            const result = await json("/api/my-runs", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                baseUrl: state.draft.baseUrl.trim(),
                apiKey: state.draft.apiKey.trim(),
                modelId: state.draft.modelId.trim(),
                mode: state.mode,
              }),
            });
            state.draft.apiKey = "";
            state.offset = 0;
            await loadRuns();
            if (result.runId) pollLive(result.runId);
          } catch (error) {
            showError(error);
          } finally {
            button.disabled = false;
            button.textContent = "提交检测";
          }
        });
      }

      function bindList(data) {
        bindCommon(loadRuns);
        bindHostActions();
        document.querySelectorAll("tbody tr").forEach((row) => row.addEventListener("click", () => {
          if (row.dataset.report) window.open(row.dataset.report, "_blank", "noopener,noreferrer");
        }));
        if (state.view === "mine") bindSubmit();
        watchPending(data.rows || []);
      }

      function watchPending(rows) {
        rows.filter((row) => row.pending).forEach((row) => pollLive(row.id));
      }

      async function pollLive(id) {
        if (state.live[id]?.timer) return;
        const tick = async () => {
          try {
            const live = await json("/api/runs/" + encodeURIComponent(id) + "/live");
            state.live[id] = { ...live, timer: state.live[id]?.timer };
            if (live.status === "completed" || live.status === "failed") {
              clearInterval(state.live[id].timer);
              delete state.live[id];
              await loadRuns();
              return;
            }
            const row = document.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
            if (row) {
              row.classList.add("live");
              row.children[2].innerHTML = ident({ id, pending: true, createdAt: row.dataset.created });
              row.children[3].innerHTML = progressCell({ id, pending: true });
              row.children[4].innerHTML = scoreCell({ id, pending: true });
            }
          } catch { /* keep pending row */ }
        };
        state.live[id] = { timer: setInterval(tick, 2000) };
        tick();
      }

      async function loadRuns() {
        setTitle();
        const params = new URLSearchParams({ limit: String(state.limit), offset: String(state.offset) });
        if (state.q) params.set("q", state.q);
        if (state.host) params.set("host", state.host);
        if (state.favorite) params.set("favorite", "1");
        if (state.model) params.set("model", state.model);
        if (state.verdict === "pending") params.set("pending", "1");
        else if (state.verdict) params.set("verdict", state.verdict);
        if (state.scoreMin !== "") params.set("scoreMin", state.scoreMin);
        if (state.scoreMax !== "") params.set("scoreMax", state.scoreMax);
        if (state.since) params.set("since", state.since);
        if (state.minWeekRate !== "") params.set("minWeekRate", state.minWeekRate);
        const data = await json("/api/" + (state.view === "mine" ? "my-runs" : "public-runs") + "?" + params);
        const crumb = state.host ? '<div class="crumb">站点 <strong>' + esc(state.host) + '</strong>　<button id="clearHost">返回全部</button></div>' : "";
        $("content").innerHTML = (state.view === "mine" ? submitForm() : "") + pageExplain() + crumb + toolbar("筛选 URL、站点或模型") + metaRow("共 " + data.total + " 条") + runTable(data.rows) + pager(data.total);
        bindList(data);
        $("clearHost")?.addEventListener("click", () => { state.host = ""; state.offset = 0; loadRuns(); });
      }

      function sortHead(id, label, cls) {
        return '<th class="sortable' + (cls ? " " + cls : "") + (state.sort === id ? " active" : "") + '" data-sort="' + id + '">' + label + (state.sort === id ? " ↓" : "") + "</th>";
      }

      async function loadSites() {
        setTitle();
        if (state.siteHost) {
          await loadSiteDetail(state.siteHost);
          return;
        }
        const params = new URLSearchParams({ limit: String(state.limit), offset: String(state.offset), sort: state.sort });
        if (state.q) params.set("q", state.q);
        if (state.favorite) params.set("favorite", "1");
        if (state.since) params.set("since", state.since);
        if (state.minWeekRate !== "") params.set("minWeekRate", state.minWeekRate);
        const data = await json("/api/sites?" + params);
        $("content").innerHTML = pageExplain() + siteToolbar() + metaRow("共 " + data.total + " 个站") +
          (data.rows.length
            ? '<table class="sites"><thead><tr>' + sortHead("host", "站点", "col-host") + sortHead("run_count", "检测次数", "col-n num") + sortHead("week_count", "近7天次数", "col-week num") + sortHead("week_rate", "近7天相符率", "col-rate num") + sortHead("substitution_count", "替换", "col-sub num") + sortHead("model_count", "模型数", "col-models num") + sortHead("last_seen_at", "最近出现", "col-time") + "</tr></thead><tbody>" +
              data.rows.map((row) => "<tr data-host=\"" + esc(row.host) + '"><td class="col-host">' + hostCell(row, "site") + '</td><td class="col-n num">' + row.run_count + '</td><td class="col-week num">' + (row.weekCount || 0) + '</td><td class="col-rate num">' + ((row.weekCount || 0) ? pct(row.weekRate) : "—") + '</td><td class="col-sub num">' + (row.substitution_count || 0) + '</td><td class="col-models num">' + row.model_count + '</td><td class="col-time">' + timeCell(row.last_seen_at) + "</td></tr>").join("") +
              "</tbody></table>"
            : '<div class="empty">还没有站点数据</div>') + pager(data.total);
        bindCommon(loadSites);
        bindHostActions();
        document.querySelectorAll("th.sortable").forEach((th) => th.addEventListener("click", () => { state.sort = th.dataset.sort; state.offset = 0; loadSites(); }));
        document.querySelectorAll("tbody tr").forEach((row) => row.addEventListener("click", () => goToSite(row.dataset.host)));
      }

      function activateNav(view) {
        document.querySelectorAll("nav button").forEach((item) => item.classList.toggle("active", item.dataset.view === view));
      }

      function goToSite(host) {
        if (!host) return;
        state.view = "sites";
        state.siteHost = host;
        state.offset = 0;
        activateNav("sites");
        loadSites().catch(showError);
      }

      function openHostRuns(view, host) {
        state.view = view;
        state.host = host;
        state.siteHost = "";
        activateNav(view);
        loadRuns().catch(showError);
      }

      function siteUrl(site) {
        if (site?.base_url) return site.base_url;
        if (site?.host) return "https://" + site.host;
        return "";
      }

      async function loadSiteDetail(host) {
        setTitle();
        const data = await json("/api/sites/" + encodeURIComponent(host));
        const site = data.site || {};
        const overview = data.overview || {};
        const favorite = site.isFavorite;
        const url = siteUrl(site);
        const models = data.models || [];
        $("content").innerHTML =
          '<div class="crumb"><button id="backSites">← 返回站点列表</button></div>' +
          '<div class="site-head">' + starBtn(host, favorite) + '<div class="host">' + esc(host) + "</div></div>" +
          '<div class="explain"><p>这个站的所有检测按域名汇总。相符率看有没有偷换模型；下面分模型看具体哪个不稳。</p></div>' +
          '<div class="site-actions">' +
          (url ? '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">打开网页</a>' : "") +
          '<a href="https://bazaarlink.ai/probe/relay/' + encodeURIComponent(host) + '" target="_blank" rel="noreferrer">官方站点页</a>' +
          '<button class="secondary" id="seePublic" type="button">看它的公开检测</button>' +
          '<button class="secondary" id="seeMine" type="button">看我的检测</button></div>' +
          '<div class="overview"><div><label>近 7 天</label><strong>' + (overview.week_count || 0) + " 次 · " + pct(overview.week_rate) + "</strong></div><div><label>累计</label><strong>" + (overview.total_count || 0) + " 次 · " + pct(overview.total_rate) + "</strong></div></div>" +
          "<p><strong>备注</strong></p>" +
          '<textarea id="siteNote" maxlength="4000">' + esc(site.note || "") + "</textarea>" +
          '<p class="save-row"><button class="go" id="saveSite" type="button">保存备注</button></p>' +
          (models.length
            ? '<table class="models"><thead><tr><th>声称模型</th><th>实际最像</th><th class="num">次数</th><th class="num">相符</th><th class="num">替换</th><th>最近</th></tr></thead><tbody>' +
              models.map((row) => "<tr><td class=\"host\">" + esc(row.model_id) + "</td><td>" + esc(row.actual_model || "—") + '</td><td class="num">' + row.sample_count + '</td><td class="num">' + (row.match_count || 0) + '</td><td class="num">' + (row.substitution_count || 0) + "</td><td>" + timeCell(row.last_seen_at) + "</td></tr>").join("") +
              "</tbody></table>"
            : '<div class="empty">这个站还没有模型汇总</div>');
        bindHostActions();
        $("backSites").addEventListener("click", () => { state.siteHost = ""; loadSites().catch(showError); });
        $("seePublic").addEventListener("click", () => openHostRuns("public", host));
        $("seeMine").addEventListener("click", () => openHostRuns("mine", host));
        $("saveSite").addEventListener("click", async () => {
          await saveSite(host, { note: $("siteNote").value });
          $("saveSite").textContent = "已保存";
        });
      }

      async function loadStatus() {
        setTitle();
        const data = await json("/api/ingest/status");
        const next = data.state.next_poll_at;
        const overdue = next && Date.parse(next) < Date.now();
        $("content").innerHTML =
          pageExplain() +
          '<div class="status-grid">' +
          "<div><label>当前间隔</label><strong>" + Math.round((data.state.current_interval_ms || 0) / 60000) + " 分钟</strong></div>" +
          "<div><label>下次采集</label><strong>" + (overdue ? "已到期，等待唤醒" : esc(relativeTime(next))) + "</strong><div class=\"time\">" + esc(clock(next)) + "</div></div>" +
          "<div><label>最近成功</label><strong>" + esc(relativeTime(data.state.last_success_at)) + "</strong><div class=\"time\">" + esc(clock(data.state.last_success_at)) + "</div></div>" +
          "<div><label>最近新增</label><strong>" + (data.recent?.[0]?.inserted ?? "-") + "</strong></div></div>" +
          "<table><thead><tr><th>开始时间</th><th>获取数</th><th>重叠数</th><th>新增数</th><th>状态</th></tr></thead><tbody>" +
          (data.recent || []).map((row) => "<tr><td>" + timeCell(row.started_at) + "</td><td>" + row.fetched + "</td><td>" + row.overlap + "</td><td>" + row.inserted + "</td><td>" + (row.error ? '<span class="ident sub">失败</span>' : row.missed ? '<span class="ident sub">疑似漏采</span>' : '<span class="pill ok">成功</span>') + "</td></tr>").join("") +
          "</tbody></table>";
      }

      async function saveSite(host, patch) {
        return json("/api/sites/" + encodeURIComponent(host), {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(patch),
        });
      }

      function showError(error) {
        $("health").textContent = error.message;
        $("health").className = "health error";
      }

      async function loadView() {
        state.offset = 0;
        if (state.view !== "public" && state.view !== "mine") state.host = "";
        if (state.view === "sites") await loadSites();
        else if (state.view === "status") await loadStatus();
        else await loadRuns();
      }

      async function boot() {
        try {
          state.copy = await json("/api/probe-copy").catch(() => null);
          state.filters = await json("/api/filters").catch(() => ({ models: [] }));
          const health = await json("/api/health");
          $("health").textContent = health.lastSuccessfulIngestAt ? "● 数据连接正常" : "● 数据库已连接";
          await loadView();
        } catch (error) {
          showError(error);
        }
      }

      $("nav").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        state.view = button.dataset.view;
        activateNav(state.view);
        resetFilters();
        loadView().catch(showError);
      });
      boot();
    </script>
  </body>
</html>
