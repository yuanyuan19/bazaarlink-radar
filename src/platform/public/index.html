<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BazaarLink 数据观察</title>
    <style>
      :root { color-scheme: light; --ink: #182232; --muted: #6c7788; --line: #e3e7ed; --soft: #f5f7fa; --blue: #2f5f9f; --green: #27785a; --red: #ba4b4b; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--soft); color: var(--ink); }
      * { box-sizing: border-box; } body { margin: 0; } button, input, select { font: inherit; }
      .shell { min-height: 100vh; display: grid; grid-template-columns: 232px 1fr; } .sidebar { background: #fff; border-right: 1px solid var(--line); padding: 26px 16px; }
      .brand { padding: 0 12px 28px; font-weight: 750; letter-spacing: .02em; } .brand small { display: block; margin-top: 6px; color: var(--muted); font-weight: 450; letter-spacing: 0; }
      nav { display: grid; gap: 4px; } nav button { border: 0; background: transparent; color: var(--muted); text-align: left; padding: 11px 12px; border-radius: 6px; cursor: pointer; }
      nav button.active, nav button:hover { background: #eef3fa; color: var(--blue); } .main { min-width: 0; padding: 34px clamp(20px, 4vw, 58px); }
      .top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 28px; } h1 { font-size: 26px; margin: 0 0 6px; } h2 { font-size: 17px; margin: 0; } .muted { color: var(--muted); }
      .health { font-size: 13px; color: var(--green); background: #edf8f2; padding: 8px 11px; border-radius: 999px; white-space: nowrap; }
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; } .stat, .panel { background: #fff; border: 1px solid var(--line); border-radius: 7px; }
      .stat { padding: 16px; } .stat label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; } .stat strong { font-size: 23px; }
      .filters { display: flex; flex-wrap: wrap; gap: 9px; padding: 14px; border-bottom: 1px solid var(--line); } input, select { min-height: 38px; border: 1px solid #cfd6e0; border-radius: 5px; padding: 0 10px; background: #fff; color: var(--ink); } input { flex: 1 1 220px; }
      button.primary { min-height: 38px; border: 0; border-radius: 5px; padding: 0 15px; background: var(--blue); color: #fff; cursor: pointer; } button.secondary { min-height: 38px; border: 1px solid #cfd6e0; border-radius: 5px; padding: 0 15px; background: #fff; cursor: pointer; }
      .panel-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 17px 18px; } .table-wrap { overflow-x: auto; } table { border-collapse: collapse; width: 100%; min-width: 820px; } th, td { padding: 12px 18px; border-top: 1px solid #edf0f4; text-align: left; white-space: nowrap; font-size: 13px; } th { color: var(--muted); font-size: 12px; font-weight: 600; background: #fbfcfd; }
      tbody tr { cursor: pointer; } tbody tr:hover { background: #f8fafc; } .badge { display: inline-block; border-radius: 999px; padding: 4px 8px; font-size: 12px; } .match { color: var(--green); background: #edf8f2; } .substitution { color: var(--red); background: #fff0f0; } .unknown { color: #8a681c; background: #fff8e5; }
      .empty { padding: 46px 18px; text-align: center; color: var(--muted); } .error { color: var(--red); } .drawer-backdrop { position: fixed; inset: 0; background: #18223233; display: none; } .drawer { position: absolute; right: 0; top: 0; height: 100%; width: min(500px, 94vw); background: #fff; padding: 26px; overflow-y: auto; box-shadow: -10px 0 30px #18223218; } .drawer-backdrop.open { display: block; }
      .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 22px 0; } .detail-grid div { padding: 13px; background: var(--soft); border-radius: 5px; } .detail-grid label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; } .close { float: right; border: 0; background: transparent; font-size: 22px; cursor: pointer; }
      @media (max-width: 760px) { .shell { display: block; } .sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; } .brand { display: inline-block; padding: 7px 10px; } nav { display: flex; overflow-x: auto; } nav button { white-space: nowrap; } .main { padding: 24px 14px; } .top { display: block; } .health { display: inline-block; margin-top: 14px; } .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar"><div class="brand">BazaarLink Insight<small>数据观察工作台</small></div><nav id="nav"><button class="active" data-view="public">公开检测</button><button data-view="mine">我的检测</button><button data-view="sites">站点列表</button><button data-view="status">采集状态</button></nav></aside>
      <main class="main"><div class="top"><div><h1 id="title">公开检测</h1><div class="muted" id="subtitle">持续保存容易消失的公开检测记录</div></div><div class="health" id="health">正在检查数据连接</div></div><section class="stats"><div class="stat"><label>当前视图记录</label><strong id="recordCount">-</strong></div><div class="stat"><label>站点数量</label><strong id="siteCount">-</strong></div><div class="stat"><label>模型数量</label><strong id="modelCount">-</strong></div><div class="stat"><label>最近采集</label><strong id="lastIngest">-</strong></div></section><section class="panel" id="content"></section></main>
    </div>
    <div class="drawer-backdrop" id="drawer"><aside class="drawer"><button class="close" id="close">×</button><h2>检测详情</h2><div id="detail" class="muted" style="margin-top:18px">正在加载…</div></aside></div>
    <script>
      const state = { view: 'public' }; const $ = id => document.getElementById(id); const esc = value => String(value ?? '-').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]);
      const formatDate = value => value ? new Date(value).toLocaleString('zh-CN', { hour12: false }) : '-';
      async function json(url, options) { const response = await fetch(url, options); const data = await response.json(); if (!response.ok) throw new Error(data.error || '请求失败'); return data; }
      function filters() { return '<div class="filters"><input id="query" placeholder="搜索站点、模型或 runId"><select id="verdict"><option value="">全部判定</option><option value="match">相符</option><option value="family_match">家族相符</option><option value="substitution">替换</option><option value="unknown">未确定</option></select><button class="primary" id="apply">查询</button><button class="secondary" id="reset">重置</button></div>'; }
      function runTable(rows) { if (!rows.length) return '<div class="empty">当前没有符合条件的记录</div>'; return '<div class="table-wrap"><table><thead><tr><th>时间</th><th>站点</th><th>宣称模型</th><th>实际模型</th><th>判定</th><th>分数</th><th>来源</th></tr></thead><tbody>' + rows.map(row => '<tr data-id="' + esc(row.id) + '"><td>' + esc(formatDate(row.createdAt)) + '</td><td>' + esc(row.host) + '</td><td>' + esc(row.modelId) + '</td><td>' + esc(row.actualModel) + '</td><td><span class="badge ' + esc(row.verdict) + '">' + esc(row.verdict) + '</span></td><td>' + esc(row.score) + '</td><td>' + (row.isMine ? '我的检测' : '公开') + '</td></tr>').join('') + '</tbody></table></div>'; }
      async function loadRuns() { const query = $('query')?.value.trim() || ''; const verdict = $('verdict')?.value || ''; const params = new URLSearchParams({ limit: '100' }); if (query) params.set('q', query); if (verdict) params.set('verdict', verdict); const data = await json('/api/' + (state.view === 'mine' ? 'my-runs' : 'public-runs') + '?' + params); $('recordCount').textContent = data.total; $('content').innerHTML = filters() + '<div class="panel-header"><h2>' + (state.view === 'mine' ? '我的检测记录' : '公开检测历史') + '</h2><span class="muted">点击记录查看详情</span></div>' + runTable(data.rows); bindFilters(); document.querySelectorAll('tbody tr').forEach(row => row.addEventListener('click', () => openDetail(row.dataset.id))); }
      async function loadSites() { const data = await json('/api/sites?limit=100'); $('recordCount').textContent = data.total; $('content').innerHTML = '<div class="panel-header"><h2>站点列表</h2><span class="muted">按最近出现时间排序</span></div>' + (data.rows.length ? '<div class="table-wrap"><table><thead><tr><th>站点</th><th>检测次数</th><th>模型数</th><th>替换次数</th><th>错误数</th><th>最近出现</th></tr></thead><tbody>' + data.rows.map(row => '<tr><td>' + esc(row.host) + '</td><td>' + row.run_count + '</td><td>' + row.model_count + '</td><td>' + (row.substitution_count || 0) + '</td><td>' + (row.error_count || 0) + '</td><td>' + esc(formatDate(row.last_seen_at)) + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">还没有站点数据</div>'); }
      async function loadStatus() { const data = await json('/api/ingest/status'); $('recordCount').textContent = data.recent?.[0]?.inserted ?? '-'; $('content').innerHTML = '<div class="panel-header"><h2>采集状态</h2></div><div style="padding:0 18px 22px"><div class="detail-grid"><div><label>当前间隔</label><strong>' + Math.round((data.state.current_interval_ms || 0) / 60000) + ' 分钟</strong></div><div><label>下次采集</label><strong>' + esc(formatDate(data.state.next_poll_at)) + '</strong></div><div><label>最近成功</label><strong>' + esc(formatDate(data.state.last_success_at)) + '</strong></div><div><label>最近新增</label><strong>' + (data.recent?.[0]?.inserted ?? '-') + '</strong></div></div><h2>最近运行</h2><div class="table-wrap"><table><thead><tr><th>开始时间</th><th>获取数</th><th>重叠数</th><th>新增数</th><th>状态</th></tr></thead><tbody>' + (data.recent || []).map(row => '<tr><td>' + esc(formatDate(row.started_at)) + '</td><td>' + row.fetched + '</td><td>' + row.overlap + '</td><td>' + row.inserted + '</td><td>' + (row.error ? '<span class="error">失败</span>' : row.missed ? '<span class="error">疑似漏采</span>' : '成功') + '</td></tr>').join('') + '</tbody></table></div></div>'; }
      async function openDetail(id) { $('drawer').classList.add('open'); const row = await json('/api/runs/' + encodeURIComponent(id)); $('detail').innerHTML = '<div class="detail-grid"><div><label>站点</label>' + esc(row.host) + '</div><div><label>模型</label>' + esc(row.model_id || row.claimed_model_id) + '</div><div><label>实际模型</label>' + esc(row.actual_model) + '</div><div><label>判定</label>' + esc(row.verdict) + '</div><div><label>检测时间</label>' + esc(formatDate(row.created_at)) + '</div><div><label>分数</label>' + esc(row.score) + '</div><div><label>Key 别名</label>' + esc(row.key_alias) + '</div><div><label>分组</label>' + esc(row.api_group) + '</div></div><p><strong>备注</strong></p><textarea id="note" style="width:100%;min-height:100px;border:1px solid #cfd6e0;border-radius:5px;padding:10px" maxlength="4000">' + esc(row.note) + '</textarea><p><button class="primary" id="saveNote">保存备注</button> <a href="' + esc(row.source_report_url) + '" target="_blank" rel="noreferrer">打开报告</a></p>'; $('saveNote').addEventListener('click', async () => { await json('/api/runs/' + encodeURIComponent(id) + '/annotation', { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ note: $('note').value }) }); $('saveNote').textContent = '已保存'; }); }
      function bindFilters() { $('apply').addEventListener('click', () => loadRuns().catch(showError)); $('reset').addEventListener('click', () => { $('query').value = ''; $('verdict').value = ''; loadRuns().catch(showError); }); }
      function showError(error) { $('health').textContent = error.message; $('health').className = 'health error'; }
      async function loadView() { const titles = { public: ['公开检测', '持续保存容易消失的公开检测记录'], mine: ['我的检测', '管理自己提交的检测、备注和分组'], sites: ['站点列表', '按站点查看检测规模与风险信号'], status: ['采集状态', '查看数据更新时间和采集健康度'] }; $('title').textContent = titles[state.view][0]; $('subtitle').textContent = titles[state.view][1]; if (state.view === 'sites') await loadSites(); else if (state.view === 'status') await loadStatus(); else await loadRuns(); }
      async function boot() { try { const health = await json('/api/health'); $('health').textContent = health.lastSuccessfulIngestAt ? '数据连接正常' : '数据库已连接'; $('siteCount').textContent = (await json('/api/sites?limit=1')).total; $('modelCount').textContent = (await json('/api/models')).rows.length; await loadView(); } catch (error) { showError(error); } }
      $('nav').addEventListener('click', event => { const button = event.target.closest('button'); if (!button) return; document.querySelectorAll('nav button').forEach(item => item.classList.remove('active')); button.classList.add('active'); state.view = button.dataset.view; loadView().catch(showError); }); $('close').addEventListener('click', () => $('drawer').classList.remove('open')); $('drawer').addEventListener('click', event => { if (event.target === $('drawer')) $('drawer').classList.remove('open'); }); boot();
    </script>
  </body>
</html>
